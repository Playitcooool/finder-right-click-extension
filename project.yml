name: TahoeNewFile
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 3MAC29ZRU9
    CODE_SIGN_IDENTITY: "Apple Development: mengxiaoyan413@gmail.com (3MAC29ZRU9)"
    ONLY_ACTIVE_ARCH: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  TahoeNewFileHost:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: Shared/Sources
    dependencies:
      - target: TahoeFinderSync
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weiciruan.tahoe.host
        PRODUCT_NAME: TahoeNewFileHost
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: mengxiaoyan413@gmail.com (3MAC29ZRU9)"
        DEVELOPMENT_TEAM: 3MAC29ZRU9
        CODE_SIGN_ENTITLEMENTS: Configs/TahoeNewFileHost.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tahoe New File
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/TahoeNewFileHost-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Shared/Sources
  TahoeFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync/Sources
      - path: Shared/Sources
      - path: Assets/Templates
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weiciruan.tahoe.host.findersync
        PRODUCT_NAME: TahoeFinderSync
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: mengxiaoyan413@gmail.com (3MAC29ZRU9)"
        DEVELOPMENT_TEAM: 3MAC29ZRU9
        CODE_SIGN_ENTITLEMENTS: Configs/TahoeFinderSync.entitlements
        INFOPLIST_FILE: Configs/TahoeFinderSync-Info.plist
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Shared/Sources
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - AppKit
